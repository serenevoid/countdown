<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7d0a12">
<title>21 November 2026 · 08:30</title>
<style>
  :root{
    --chilli:#c2202a;
    --chilli-deep:#7d0a12;
    --chilli-ink:#8e0f18;
    --chilli-soft:rgba(142,15,24,.5);
    --chilli-line:rgba(142,15,24,.14);
    --white:#fffdfb;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(18px,4vw,34px);
    padding:clamp(14px,4vw,48px);
    background:
      radial-gradient(130% 95% at 50% -5%, #cf2430 0%, transparent 58%),
      radial-gradient(90% 70% at 50% 108%, #8b0d16 0%, transparent 62%),
      linear-gradient(180deg,var(--chilli) 0%,var(--chilli-deep) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* soft top sheen */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 32%);
  }

  .card{
    position:relative;
    width:100%;max-width:940px;
    background:var(--white);
    border-radius:8px;
    padding:clamp(34px,6vw,64px) clamp(20px,5.5vw,72px);
    box-shadow:0 30px 70px rgba(43,4,9,.42);
  }

  /* short chilli accent bar */
  .card::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:54px;height:3px;border-radius:0 0 2px 2px;
    background:var(--chilli);
  }

  .timer{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    align-items:center;
    text-align:center;
  }

  .unit{position:relative;padding:clamp(10px,1.8vw,18px) clamp(4px,1.4vw,18px)}

  /* ::before = horizontal rule, ::after = vertical rule */
  .unit::before,.unit::after{content:"";position:absolute;background:var(--chilli-line)}

  .unit + .unit::after{
    top:14%;bottom:14%;left:0;width:1px;height:auto;
  }

  .num{
    display:block;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(46px,11vw,102px);
    line-height:1;
    font-weight:400;
    letter-spacing:-.01em;
    font-variant-numeric:tabular-nums lining-nums;
    color:var(--chilli-ink);
  }

  .lbl{
    display:block;margin-top:clamp(10px,1.6vw,18px);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(9.5px,1.35vw,12.5px);
    font-weight:500;
    letter-spacing:.24em;
    text-indent:.24em;
    text-transform:uppercase;
    color:var(--chilli-soft);
  }


  /* ---------- names + heartbeat ---------- */
  .couple{
    display:flex;align-items:center;justify-content:center;
    gap:clamp(16px,5vw,44px);
    margin:0 auto clamp(18px,3.4vw,32px);
  }
  .name{
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(22px,4.4vw,38px);
    line-height:1;
    letter-spacing:.04em;
    color:var(--chilli-ink);
  }
  .name .amp{
    display:block;margin-top:.35em;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(10px,1.5vw,13px);
    font-weight:500;letter-spacing:.3em;text-indent:.3em;
    text-transform:uppercase;
    color:var(--chilli-soft);
  }

  .pulse{
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:clamp(40px,5.4vw,52px);height:clamp(40px,5.4vw,52px);
    color:var(--chilli);
    filter:drop-shadow(0 4px 8px rgba(142,15,24,.28));
    will-change:transform;
  }
  .pulse svg{width:100%;height:100%;display:block;overflow:visible}
  .pulse .beat{transform-box:fill-box;transform-origin:center}

  /* lub-dub, one cycle per second */
  .pulse.on .beat{animation:beat 1s cubic-bezier(.2,.6,.3,1) infinite}
  @keyframes beat{
    0%   {transform:scale(1)}
    8%   {transform:scale(1.18)}
    16%  {transform:scale(1)}
    26%  {transform:scale(1.11)}
    36%  {transform:scale(1)}
    100% {transform:scale(1)}
  }
  .pulse.on .ring{
    transform-box:fill-box;transform-origin:center;
    animation:ring 1s ease-out infinite;
  }
  @keyframes ring{
    0%   {transform:scale(1);opacity:.45}
    30%  {transform:scale(1.5);opacity:0}
    100% {transform:scale(1.5);opacity:0}
  }

  /* ---------- progress ---------- */
  .progress{margin-top:clamp(24px,4.2vw,40px)}
  .track{
    position:relative;height:3px;border-radius:3px;
    background:var(--chilli-line);overflow:hidden;
  }
  .fill{
    position:absolute;top:0;bottom:0;left:0;width:0;
    border-radius:3px;
    background:linear-gradient(90deg,#a3121c,var(--chilli) 60%,#e0484f);
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }
  .pct{
    margin-top:clamp(9px,1.4vw,13px);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    font-size:clamp(9.5px,1.35vw,12.5px);
    font-weight:500;letter-spacing:.24em;text-indent:.24em;
    text-transform:uppercase;color:var(--chilli-soft);
  }

  @media (max-width:600px){
    /* one value per row, number above its label */
    .timer{grid-template-columns:minmax(0,1fr)}
    .unit{padding:clamp(16px,4.6vw,24px) clamp(8px,4vw,20px)}
    .unit + .unit::after{content:none}
    .unit + .unit::before{
      top:0;bottom:auto;left:0;right:0;width:auto;height:1px;
    }
    .num{font-size:clamp(48px,15vw,72px)}
  }

  @media (prefers-reduced-motion:reduce){
    .pulse .beat,.pulse .ring{animation:none}
  }
</style>
</head>
<body>
  <main class="card">
    <div class="couple">
      <p class="name">Siva <span class="amp">Bride</span></p>

      <div class="pulse" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path class="ring" d="M12 21s-7.5-4.7-9.4-9.1C1.1 8.2 3.2 4.6 6.7 4.1 9 3.8 11 5.2 12 7c1-1.8 3-3.2 5.3-2.9 3.5.5 5.6 4.1 4.1 7.8C19.5 16.3 12 21 12 21z"
                fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
          <path class="beat" d="M12 21s-7.5-4.7-9.4-9.1C1.1 8.2 3.2 4.6 6.7 4.1 9 3.8 11 5.2 12 7c1-1.8 3-3.2 5.3-2.9 3.5.5 5.6 4.1 4.1 7.8C19.5 16.3 12 21 12 21z"
                fill="currentColor"/>
        </svg>
      </div>

      <p class="name">Aju <span class="amp">Groom</span></p>
    </div>

    <div class="timer" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="days">00</span><span class="lbl">Days</span></div>
      <div class="unit"><span class="num" id="hours">00</span><span class="lbl">Hours</span></div>
      <div class="unit"><span class="num" id="minutes">00</span><span class="lbl">Minutes</span></div>
      <div class="unit"><span class="num" id="seconds">00</span><span class="lbl">Seconds</span></div>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" id="fill"></div></div>
      <p class="pct" id="pct">0% of the way there</p>
    </div>
  </main>

<script>
(function () {
  "use strict";

  var TARGET = new Date(2026, 10, 21, 8, 30, 0); // 21 Nov 2026, 08:30 local
  var START  = new Date(2026, 1, 5, 0, 0, 0);    // 5 Feb 2026, journey began

  var el = {
    days: document.getElementById("days"),
    hours: document.getElementById("hours"),
    minutes: document.getElementById("minutes"),
    seconds: document.getElementById("seconds")
  };
  var fill = document.getElementById("fill");
  var pct = document.getElementById("pct");
  var prev = {};

  function pad(n, w) {
    n = String(n);
    while (n.length < w) n = "0" + n;
    return n;
  }

  function put(node, value) {
    if (prev[node.id] === value) return;
    prev[node.id] = value;
    node.textContent = value;
  }

  var SPAN = TARGET.getTime() - START.getTime();

  function progress() {
    var done = Date.now() - START.getTime();
    if (done < 0) done = 0;
    var r = done / SPAN;
    if (r < 0) r = 0;
    if (r > 1) r = 1;
    fill.style.width = (r * 100).toFixed(2) + "%";
    var shown = Math.floor(r * 100) + "%";
    if (prev.pct !== shown) {
      prev.pct = shown;
      pct.textContent = r >= 1 ? "100% \u00b7 the wait is over" : shown + " of the way there";
    }
  }

  var pulse = document.querySelector(".pulse");

  function beat() {
    pulse.classList.remove("on");
    void pulse.offsetWidth; // restart the animation so it lands on the second
    pulse.classList.add("on");
  }

  function render() {
    var ms = TARGET.getTime() - Date.now();
    progress();

    if (ms <= 0) {
      put(el.days, "00"); put(el.hours, "00");
      put(el.minutes, "00"); put(el.seconds, "00");
      clearInterval(timer);
      return;
    }

    var s = Math.floor(ms / 1000);
    var sec = pad(s % 60, 2);
    if (prev.seconds !== sec) beat();
    put(el.days, pad(Math.floor(s / 86400) % 100, 2));
    put(el.hours, pad(Math.floor(s / 3600) % 24, 2));
    put(el.minutes, pad(Math.floor(s / 60) % 60, 2));
    put(el.seconds, sec);
  }

  var timer = setInterval(render, 250);
  render();
})();
</script>
</body>
</html>
